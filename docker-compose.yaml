services:
  nginx:
    image: "nginx:stable-alpine"
    ports:
      - "8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src:/var/www/laravel
    depends_on:
      - mysql
      - php

  php:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
      args:
        UID: "${HOST_UID:-1000}"
        GID: "${HOST_GID:-1000}"
    volumes:
      - ./src:/var/www/laravel

  mysql:
    image: mysql:9.0
    ports:
      - "33063:3306"
    env_file:
      - env/mysql.env

  # Файлы, которые создаёт composer (vendor, composer.lock), принадлежат вашему
  # пользователю, а не root. На машине с другим uid: export HOST_UID=$(id -u) HOST_GID=$(id -g)
  composer:
    build:
      context: dockerfiles
      dockerfile: composer.Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - ./src:/var/www/laravel

  # Артисан-команды (make:model, make:migration, ...) создают файлы от вашего
  # пользователя. На машине с другим uid: export HOST_UID=$(id -u) HOST_GID=$(id -g)
  artisan:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
      args:
        UID: "${HOST_UID:-1000}"
        GID: "${HOST_GID:-1000}"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - ./src:/var/www/laravel
    entrypoint: ["php", "/var/www/laravel/artisan"]
